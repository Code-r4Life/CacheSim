# CI: the gates from AGENTS.md section 3 on every push and pull request.
#   native: GCC and Clang Release with -Werror, plus GCC Debug under ASan + UBSan; all suites.
#   wasm:   the Emscripten browser module, loaded and checked in Node (tests/wasm/smoke.mjs).
name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**", "docs/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            type: Release
            flags: ""
          - name: clang-release
            cc: clang
            cxx: clang++
            type: Release
            flags: ""
          - name: gcc-asan-ubsan
            cc: gcc
            cxx: g++
            type: Debug
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DCCSIM_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Test
        # A suite exits 77 (skipped) when zlib is missing; zlib is installed here, so a skip is a failure.
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error | tee ctest.log
          if grep -q 'Skipped' ctest.log; then echo "::error::a suite was skipped"; exit 1; fi

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DCCSIM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-wasm --target ccsim_wasm
      - name: Size
        run: ls -l build-wasm/src/wasm/ccsim.mjs build-wasm/src/wasm/ccsim.wasm
      - name: Smoke test in Node
        # 77 = session checks skipped because src/policy/ (configuration track) is not merged yet.
        run: |
          set +e
          node tests/wasm/smoke.mjs build-wasm/src/wasm/ccsim.mjs
          code=$?
          if [ "$code" -eq 77 ]; then echo "::warning::wasm session checks skipped: no production policies yet"; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ccsim-wasm
          path: |
            build-wasm/src/wasm/ccsim.mjs
            build-wasm/src/wasm/ccsim.wasm
          retention-days: 14
